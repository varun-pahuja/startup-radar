[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "startup-radar"
version = "0.1.0"
description = "Find startups, internships, and OSS issues worth your time — and prove it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Varun Pahuja" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "typer>=0.12",
  "jinja2>=3",
  "rich>=13",
  "pyyaml>=6",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "feedparser>=6",
  "litellm>=1.40",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
sheets = ["google-api-python-client>=2", "google-auth>=2"]
notion = ["notion-client>=2"]
html = []
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
startup-radar = "startup_radar.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/startup_radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
packages = ["startup_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
